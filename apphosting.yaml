# Firebase App Hosting backend config for the marketplace admin portal.
# The NEXT_PUBLIC_* values are the Firebase web-app config — public by design
# (security is enforced by firestore.rules), so plain values are fine here.
runConfig:
  maxInstances: 1

env:
  - variable: NEXT_PUBLIC_FB_API_KEY
    value: "REPLACE_WITH_WEB_API_KEY"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FB_AUTH_DOMAIN
    value: "REPLACE_WITH_PROJECT_ID.firebaseapp.com"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FB_PROJECT_ID
    value: "REPLACE_WITH_PROJECT_ID"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FB_APP_ID
    value: "REPLACE_WITH_WEB_APP_ID"
    availability: [BUILD, RUNTIME]

  # Public site details. NEXT_PUBLIC_SITE_URL is this backend's own origin —
  # it must differ between staging and production. The two addresses are shown
  # on /support and /privacy, the pages the store listings point at.
  - variable: NEXT_PUBLIC_SITE_URL
    value: "REPLACE_WITH_SITE_ORIGIN"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_SUPPORT_EMAIL
    value: "contact@higglerslab.com"
    availability: [BUILD, RUNTIME]
  # Same inbox as support until a dedicated security address exists.
  - variable: NEXT_PUBLIC_SECURITY_EMAIL
    value: "contact@higglerslab.com"
    availability: [BUILD, RUNTIME]

  # Google Analytics 4 measurement ID. Use a separate GA property (or leave
  # this blank) on staging so test traffic stays out of production reports.
  # Blank or a REPLACE_WITH placeholder disables the tag entirely.
  - variable: NEXT_PUBLIC_GA_MEASUREMENT_ID
    value: "REPLACE_WITH_GA_MEASUREMENT_ID"
    availability: [BUILD, RUNTIME]
